name: Build

on:
  push:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@v7.0.1

    - name: Set up JDK
      uses: actions/setup-java@v6.0.0
      with:
        distribution: temurin
        java-version: 25

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v6.3.0

    - name: Build with Gradle
      run: ./gradlew build

    - name: Upload build artifact
      uses: plasmoapp/actions/.github/actions/upload-artifacts@main
      with:
        files_glob: build/libs/*.jar
        archive: false
        if_no_files_found: error
        summary: false
