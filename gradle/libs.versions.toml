[versions]
kotlin = "2.4.10"
kotlinx = "1.11.0"
ktlint = "1.8.0"
ktlint-gradle = "14.2.0"
modstitch = "0.8.5"
mod-publish = "2.2.0"

[libraries]
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinx" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ktlint = { id = "org.jlleitschuh.gradle.ktlint", version.ref = "ktlint-gradle" }
modstitch = { id = "dev.isxander.modstitch.base", version.ref = "modstitch" }
modpublish = { id = "me.modmuss50.mod-publish-plugin", version.ref = "mod-publish" }
