modLoader = "kotlinforforge"
loaderVersion = "${kotlin_for_forge_range}"
license = "${mod_license}"
issueTrackerURL = "https://github.com/apehum/dreamdisplays-sable/issues"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
description = '''${mod_description}'''
authors = "${mod_author}"

[[dependencies.${mod_id}]]
modId = "neoforge"
type = "required"
versionRange = "${neoforge_loader_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "dreamdisplays"
type = "required"
versionRange = "${dreamdisplays_range}"
ordering = "AFTER"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "sable"
type = "required"
versionRange = "${sable_range}"
ordering = "AFTER"
side = "BOTH"
